name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Catalogues aren't committed; they're generated from specs/.
      - run: pnpm generate
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec vp pack
      - run: ./bin/hl --help
